name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job writes to the repo; keep the token read-only and out of .git/config
# so third-party tools (cargo-audit, npm packages) can't reuse it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build and test frontend
        working-directory: app
        run: |
          npm ci
          npm run build
          npm test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Runs the whole test suite once, measuring coverage. Tauri command glue
      # and CLI entry points are left out: they only wire tested code together.
      - name: Test with coverage gate
        run: >
          cargo llvm-cov --workspace --fail-under-lines 85
          --ignore-filename-regex '(rockhound-replay/src/main\.rs|src-tauri/src/(main|lib)\.rs)'

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on known vulnerabilities; unmaintained-crate notices only warn.
      - run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit
        working-directory: app
        run: npm audit --audit-level=high

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      # Windows-only code (game capture, OCR) is only compiled here.
      - run: cargo clippy -p rockhound-app --all-targets -- -D warnings
      - run: cargo test -p rockhound-app
      # Builds the frontend, the release exe and the NSIS installer.
      - name: Build app
        working-directory: app
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: rockhound-windows
          path: |
            target/release/rockhound-app.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
