name: CI

# Changes that can't affect the app (docs, the website, repo housekeeping)
# skip the build. A release always bumps the version in source files, so it
# still runs the whole pipeline.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
      - site/**
      - .github/ISSUE_TEMPLATE/**
      - .github/dependabot.yml
      - .github/workflows/pages.yml
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
      - site/**
      - .github/ISSUE_TEMPLATE/**
      - .github/dependabot.yml
      - .github/workflows/pages.yml

# Only the release job writes to the repo, and it runs no third-party code.
# Keep the token read-only and out of .git/config elsewhere so third-party
# tools (cargo-audit, npm packages) can't reuse it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev ffmpeg
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build and test frontend
        working-directory: app
        run: |
          npm ci
          npm run build
          npm run typecheck:e2e
          npm test
      # Fails the PR, not the release after merge, when a version bump missed
      # a file or the DEVLOG entry that becomes the release notes.
      - name: Check version and release notes
        run: node app/scripts/release.mjs notes "$(node app/scripts/release.mjs version)" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Runs the whole test suite once, measuring coverage. Tauri command glue
      # and CLI entry points are left out: they only wire tested code together.
      - name: Test with coverage gate
        run: >
          cargo llvm-cov --workspace --fail-under-lines 85
          --ignore-filename-regex '(rockhound-(replay|sigextract)/src/main\.rs|src-tauri/src/(main|lib)\.rs)'

  # Drives the built app through WebDriver with a recorded game standing in
  # for Star Citizen, as a player would: start, read, stop, settings.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Tauri, WebDriver and video libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev webkit2gtk-driver xvfb ffmpeg
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tauri-driver --locked
      - name: End-to-end tests
        working-directory: app
        run: |
          npm ci
          xvfb-run -a npm run e2e

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on known vulnerabilities; unmaintained-crate notices only warn.
      - run: cargo audit
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit
        working-directory: app
        run: npm audit --audit-level=high

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      # Windows-only code (game capture, OCR) is only compiled here.
      - run: cargo clippy -p rockhound-app --all-targets -- -D warnings
      - run: cargo test -p rockhound-app
      # Builds the frontend, the release exe and the NSIS installer. With the
      # updater key (not given to Dependabot or fork PRs) it also signs the
      # installer, which installed apps check before updating themselves.
      - name: Build app
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build
          fi
      # The game-data extractor, for refreshing data/signatures.json.
      - run: cargo build --release -p rockhound-sigextract
      - uses: actions/upload-artifact@v7
        with:
          name: rockhound-windows
          path: |
            target/release/rockhound-app.exe
            target/release/sigextract.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  # Every push to main that passes all jobs and carries a version without a
  # release yet publishes one: the installer, the portable exe, and notes made
  # of that version's DEVLOG entry plus the PRs merged since the last release.
  # The installer's signature and latest.json go with them; installed apps
  # read latest.json from the newest release to update themselves.
  # Merges that don't bump the version (Dependabot) release nothing.
  release:
    needs: [check, e2e, audit, windows-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Queue rather than race, so two quick merges can't both create a release,
    # and keep every pending run (the default keeps only the newest), so no
    # version bump goes unreleased.
    concurrency:
      group: release
      queue: max
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Decide whether to release
        id: version
        run: |
          version=$(node app/scripts/release.mjs version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          assets=$(gh release view "v$version" --json isDraft,assets \
            --jq 'select(.isDraft | not) | .assets[].name' 2>/dev/null || true)
          if grep -qxF "Rockhound_${version}_x64-setup.exe" <<< "$assets" &&
             grep -qxF "Rockhound_${version}_x64-setup.exe.sig" <<< "$assets" &&
             grep -qxF "Rockhound_${version}_portable.exe" <<< "$assets" &&
             grep -qxF "latest.json" <<< "$assets"; then
            echo "v$version is already released."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v7
        if: steps.version.outputs.release
        with:
          name: rockhound-windows
          path: artifact
      - name: Publish GitHub Release
        if: steps.version.outputs.release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node app/scripts/release.mjs notes "$VERSION" > notes.md
          cat notes.md
          cp artifact/rockhound-app.exe "Rockhound_${VERSION}_portable.exe"
          setup="artifact/bundle/nsis/Rockhound_${VERSION}_x64-setup.exe"
          if [ ! -f "$setup.sig" ]; then
            echo "::error::The installer is unsigned. Add the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets."
            exit 1
          fi
          node app/scripts/release.mjs latest "$VERSION" "$GH_REPO" "$setup.sig" > latest.json
          cat latest.json
          files=("$setup" "$setup.sig" "Rockhound_${VERSION}_portable.exe" latest.json)
          # A release left without its files, or as a draft, by a failed
          # upload or publish gets them now and is published.
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "${files[@]}" --clobber
            gh release edit "v$VERSION" --draft=false
          else
            gh release create "v$VERSION" "${files[@]}" --target "$GITHUB_SHA" \
              --title "Rockhound v$VERSION" --notes-file notes.md --generate-notes
          fi
