name: agents-md
on: [push, pull_request]
permissions:
  contents: read
jobs:
  length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: AGENTS.md has at most 20 lines
        run: |
          n=$(wc -l < AGENTS.md)
          echo "AGENTS.md: $n lines"
          [ "$n" -le 20 ] || { echo "::error file=AGENTS.md::AGENTS.md has $n lines; keep it at 20 or fewer and move details to linked docs"; exit 1; }
